<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospital Management System</title>
<style>
:root{--ink:#10263b;--mute:#586a7d;--line:#d9e2ec;--bg:#f2f5f9;--card:#fff;--navy:#0c2d4a;--btn:#0f766e;--teal:#0f766e;--tint:#e1f1ef;--blue:#1e6aa3;--warn:#8a4b08;--wbg:#fdf0d5;--bad:#a32525;--bbg:#fbe3e3;--ok:#0b6b49;--obg:#d9f2e6;--gbg:#e6ecf2;--shadow:0 1px 2px rgba(12,45,74,.06),0 8px 20px rgba(12,45,74,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e4ecf4;--mute:#9db0c3;--line:#264058;--bg:#0b1824;--card:#112638;--navy:#0a2238;--teal:#5eead4;--tint:#11403c;--blue:#7cc0ee;--warn:#fcd34d;--wbg:#4a3a0e;--bad:#fca5a5;--bbg:#4c1d1d;--ok:#6ee7b7;--obg:#0f3d30;--gbg:#1c3349;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--ink:#e4ecf4;--mute:#9db0c3;--line:#264058;--bg:#0b1824;--card:#112638;--navy:#0a2238;--teal:#5eead4;--tint:#11403c;--blue:#7cc0ee;--warn:#fcd34d;--wbg:#4a3a0e;--bad:#fca5a5;--bbg:#4c1d1d;--ok:#6ee7b7;--obg:#0f3d30;--gbg:#1c3349;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}.mu{color:var(--mute);font-size:13px}
.wrap{width:min(1100px,100% - 32px);margin:0 auto}
.lg{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.lg i{width:34px;height:34px;border-radius:9px;background:var(--btn);color:#fff;display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:600;line-height:1}
.nav{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:62px}
.nl{display:flex;gap:22px}.nl a{color:#c9d9e8;text-decoration:none;font-size:14px;font-weight:600}.nl a:hover{color:#fff}
.hero{background:var(--navy);color:#fff;padding:54px 0 60px}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.hp{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 30px rgba(0,0,0,.35);line-height:0}.hp svg{width:100%;height:auto;display:block}
.hp .pn{position:absolute;left:14px;bottom:14px;line-height:1.3;padding:12px 16px;background:rgba(12,45,74,.9);backdrop-filter:blur(4px)}.hp .pn b{font-size:34px;margin:4px 0 0}
.hero h1{font-size:clamp(30px,4.6vw,46px);font-weight:700;letter-spacing:-.025em}
.hero p{max-width:50ch;margin:16px 0 26px;color:#c3d4e4;font-size:17px}
a.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:9px;background:var(--btn);color:#fff;margin:0 10px 10px 0}
a.btn.o{background:transparent;border:1px solid rgba(255,255,255,.4)}
.pn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:24px}
.pn small{color:#b4c8dc;font-size:13px}.pn b{display:block;font-size:54px;line-height:1.1;margin:8px 0 2px;font-weight:700}.pn span{color:#c3d4e4;font-size:14px}
.sec{padding:46px 0 6px}.sec h2{font-size:26px}.sub{color:var(--mute);margin:6px 0 20px;max-width:62ch}
.tool{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.tool input{flex:1 1 240px;max-width:360px}.tool select{width:auto;min-width:200px}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dc .hd{display:flex;gap:12px;align-items:center}.dc .hd b{font-size:16px}
.av{width:46px;height:46px;border-radius:50%;background:var(--tint);color:var(--teal);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.wk{display:flex;gap:4px;flex-wrap:wrap}.wk i{font-style:normal;font-size:11px;padding:3px 7px;border-radius:6px;background:var(--gbg);color:var(--mute)}.wk i.on{background:var(--tint);color:var(--teal);font-weight:700}
.ck{flex-direction:row;align-items:center;gap:3px;font-weight:500;font-size:12px}
.two{display:grid;grid-template-columns:minmax(0,400px) 1fr;gap:20px;align-items:start}
.rl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}.rc:hover{border-color:var(--teal)}
.rc b{display:block;font-size:14px}.rc .d{font-size:12px;color:var(--mute);line-height:1.4}
.ic{width:42px;height:42px;border-radius:10px;background:var(--tint);color:var(--navy);display:grid;place-items:center;font-size:22px;line-height:1;flex:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic{color:var(--ink)}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--btn);border-radius:10px;padding:16px 18px}.fc b{display:block;margin-bottom:4px}.fc span{font-size:13px;color:var(--mute)}
.foot{background:var(--navy);color:#9fb4c9;text-align:center;padding:26px 16px;font-size:13px;margin-top:46px}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--navy);color:#c9d9e8;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
aside .lg{color:#fff;font-size:16px;padding:0 8px 14px}
aside a{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500}
aside a:hover{background:rgba(255,255,255,.08)}aside a.on{background:var(--btn);color:#fff}aside a.out{margin-top:auto;border:1px solid rgba(255,255,255,.28)}
main{padding:28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.top h1{font-size:24px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}.c h3{font-size:16px;margin-bottom:12px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}.s b{display:block;font-size:26px;color:var(--teal)}.s span{font-size:13px;color:var(--mute)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mute)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}td input{min-width:70px}input[type=checkbox]{width:auto;min-width:0}
button{font:600 14px inherit;font-family:inherit;border:0;border-radius:8px;padding:10px 16px;background:var(--btn);color:#fff;cursor:pointer}
button.sm{padding:6px 11px;font-size:13px}button.g{background:var(--tint);color:var(--teal)}button.d{background:var(--bbg);color:var(--bad)}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--tint);color:var(--teal)}
.b.booked,.b.pending,.b.unpaid,.b.soon{background:var(--wbg);color:var(--warn)}.b.done,.b.paid,.b.ready,.b.active,.b.now{background:var(--obg);color:var(--ok)}.b.cancelled,.b.low,.b.disabled,.b.leave{background:var(--bbg);color:var(--bad)}.b.off,.b.ended{background:var(--gbg);color:var(--mute)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;display:none;z-index:40}
@media(max-width:860px){.hero .wrap,.two{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center}aside .lg{display:none}aside a{white-space:nowrap}aside a.out{margin:0 0 0 auto}.st{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.g3,.rl{grid-template-columns:1fr}main{padding:16px}.nl{gap:14px}}

.hp{min-height:360px;background:linear-gradient(135deg,#14436b 0%,#0c2d4a 55%,#0f5f5a 100%)}
.hp::before{content:"+";position:absolute;right:8%;top:50%;transform:translateY(-50%);font:200 200px/1 'Segoe UI',system-ui,sans-serif;color:rgba(255,255,255,.08)}
.hp .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.hp::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to top,rgba(8,28,46,.8),rgba(8,28,46,0) 55%)}
.hp .pn{z-index:3}
.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.dc .av{width:68px;height:68px;font-size:26px;border:2px solid var(--line)}
.td{display:flex;align-items:center;gap:10px}.td .av{width:38px;height:38px;font-size:15px}
.pr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.pr:last-child{border:0}.pr .av{width:56px;height:56px;font-size:20px}.pr b{flex:1 1 160px}
.pr .hero-t{width:96px;height:56px;border-radius:8px;object-fit:cover;background:var(--gbg)}
.upb{display:inline-block;padding:8px 14px;border-radius:8px;background:var(--btn);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.upb.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cfab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;padding:0;font-size:26px;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:35}
.cfab em{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/20px system-ui;font-style:normal;text-align:center;padding:0 5px}
.cp{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:360px;max-width:calc(100vw - 24px);height:min(520px,calc(100vh - 140px));background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 14px 40px rgba(0,0,0,.3);overflow:hidden;z-index:35}
.ch{background:var(--navy);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.ch small{display:block;color:#b4c8dc;font-size:11px}
.ct{display:flex;border-bottom:1px solid var(--line)}.ct button{flex:1;background:transparent;color:var(--mute);border-radius:0;padding:10px 6px;font-size:13px}.ct button.on{color:var(--teal);box-shadow:inset 0 -2px var(--teal)}
.cm{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.mg{max-width:86%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.45;background:var(--card);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.mg.me{align-self:flex-end;background:var(--btn);color:#fff;border-color:transparent}.mg small{display:block;font-size:11px;color:var(--mute);margin-bottom:2px}.mg.me small{color:#d6f1ee}
.cn{font-size:12px;color:var(--mute);text-align:center;padding:2px 6px}
.cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--card)}.cf input{flex:1}
.cq{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px;background:var(--card)}.cq button{background:var(--tint);color:var(--teal);font-size:12px;padding:5px 10px;border-radius:99px}
@media(max-width:520px){.cp{right:12px;left:12px;width:auto;max-width:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div><div id="chat"></div>
<script>
const today=new Date().toLocaleDateString('sv');
const S={
pts:[{id:1,name:'Ali Raza',phone:'0300-1111111',age:34,g:'M'},{id:2,name:'Fatima Noor',phone:'0301-2222222',age:28,g:'F'},{id:3,name:'Hamza Iqbal',phone:'0302-3333333',age:9,g:'M'}],
docs:[{id:1,name:'Dr. Ayesha Khan',dept:'Cardiology',fee:2000,days:[1,2,3,4,5],from:'09:00',to:'14:00',leave:false},{id:2,name:'Dr. Usman Malik',dept:'General Medicine',fee:1000,days:[1,2,3,4,5,6],from:'10:00',to:'18:00',leave:false},{id:3,name:'Dr. Sana Raza',dept:'Gynecology',fee:1500,days:[1,3,5],from:'14:00',to:'20:00',leave:false},{id:4,name:'Dr. Imran Shah',dept:'Pediatrics',fee:1200,days:[1,2,3,4,5],from:'09:00',to:'15:00',leave:true}],
apts:[{id:1,pid:1,did:1,date:today,status:'booked'},{id:2,pid:2,did:1,date:today,status:'checkedin'},{id:3,pid:3,did:2,date:today,status:'done',vit:{bp:'100/65',t:'99.1',p:'92'},dx:'Throat infection'}],
meds:[{id:1,name:'Paracetamol 500mg',stock:120,min:30,price:5},{id:2,name:'Amoxicillin 500mg',stock:24,min:30,price:25},{id:3,name:'ORS Sachet',stock:60,min:20,price:15},{id:4,name:'Atorvastatin 20mg',stock:80,min:25,price:30}],
rx:[{id:1,aid:3,mid:2,qty:10,dose:'1 capsule, 3 times daily',done:false}],
labs:[{id:1,aid:3,test:'CBC',result:'',price:800}],
inv:[{id:1,aid:3,paid:false,items:[{n:'Consultation',amt:1000},{n:'Lab: CBC',amt:800}]}],
users:[{id:1,name:'Super Admin',role:'superadmin',on:true},{id:2,name:'Hina Tariq',role:'admin',on:true},{id:3,name:'Sadia Bibi',role:'reception',on:true},{id:4,name:'Nurse Amna',role:'nurse',on:true},{id:5,name:'Bilal Ahmed',role:'pharmacist',on:true},{id:6,name:'Kamran Ali',role:'lab',on:true},{id:7,name:'Zara Hussain',role:'accountant',on:true}],
log:[],hosp:'CarePoint Medicare Hospital',prod:'MediCore HMS'};
let U=null,tab=0,sel=null,seq=100;
const $=id=>document.getElementById(id),v=id=>$(id).value.trim();
let P={};try{P=JSON.parse(localStorage.getItem('hms_photos')||'{}')}catch(e){}
const savePh=()=>{try{localStorage.setItem('hms_photos',JSON.stringify(P))}catch(e){say('Photo saved for this session only (browser storage is full)')}};
const dph=d=>P['d'+d.id]||'doctors/'+d.id+'.jpg';
const avt=d=>`<div class="av"><span>${d.name.replace('Dr. ','')[0]}</span><img src="${dph(d)}" alt="${d.name}" loading="lazy" onerror="this.remove()"></div>`;
const heroImg=()=>`<img class="ph" src="${P.hero||'hospital.jpg'}" alt="Hospital building" onerror="this.remove()">`;
function upload(key,f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const mx=key=='hero'?1400:520,k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);P[key=='hero'?'hero':'d'+key]=c.toDataURL('image/jpeg',.86);savePh();log('Updated photo');say('Photo saved');render()};im.onerror=()=>say('Could not read that image');im.src=r.result};r.readAsDataURL(f)}
const pn=i=>(S.pts.find(p=>p.id==i)||{}).name,dn=i=>(S.docs.find(d=>d.id==i)||{}).name,md=i=>S.meds.find(m=>m.id==i),ap=i=>S.apts.find(a=>a.id==i);
const money=n=>'Rs '+n.toLocaleString(),tot=i=>i.items.reduce((s,x)=>s+x.amt,0);
const bd=s=>`<span class="b ${s}">${s}</span>`,btn=(a,i,t,c='')=>`<button class="sm ${c}" data-a="${a}" data-i="${i}">${t}</button>`;
const opt=(a,k)=>a.map(x=>`<option value="${x.id}">${x.name}${k?' — '+x[k]:''}</option>`).join('');
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="mu">Nothing here yet</td></tr>`}</table></div>`;
const card=(t,b)=>`<div class="c"><h3>${t}</h3>${b}</div>`;
const stats=a=>`<div class="st">${a.map(x=>`<div class="s"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>`;
const inp=(id,l,x='')=>`<label>${l}<input id="${id}" ${x}></label>`;
const revenue=()=>S.inv.filter(i=>i.paid).reduce((s,i)=>s+tot(i),0),pending=()=>S.inv.filter(i=>!i.paid).reduce((s,i)=>s+tot(i),0);

let q='',dep='';
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],WO=[1,2,3,4,5,6,0];
const tm=t=>{const[a,b]=t.split(':');return((+a)%12||12)+':'+b+(+a<12?' AM':' PM')};
function avail(d){const n=new Date(),hm=n.toTimeString().slice(0,5);if(d.leave)return{k:'leave',t:'On leave today'};if(!d.days.includes(n.getDay()))return{k:'off',t:'Off duty today'};if(hm<d.from)return{k:'soon',t:'Starts at '+tm(d.from)};if(hm>d.to)return{k:'ended',t:'Shift ended'};return{k:'now',t:'Available now'}}
const ab=d=>{const a=avail(d);return `<span class="b ${a.k}">${a.t}</span>`};
const week=d=>`<div class="wk">${WO.map(k=>`<i class="${d.days.includes(k)?'on':''}">${DN[k]}</i>`).join('')}</div>`;
const onDuty=(d,date)=>!(date==today&&d.leave)&&d.days.includes(new Date(date+'T00:00').getDay());
function docList(){const r={now:0,soon:1,ended:2,off:3,leave:4};const L=S.docs.filter(d=>(!dep||d.dept==dep)&&(d.name+' '+d.dept).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>r[avail(a).k]-r[avail(b).k]);
return L.length?`<div class="dg">${L.map(d=>`<div class="dc"><div class="hd">${avt(d)}<div><b>${d.name}</b><div class="mu">${d.dept}</div></div></div><div>${ab(d)}</div><div class="mu">Duty hours: ${tm(d.from)} to ${tm(d.to)}<br>Consultation fee: ${money(d.fee)}</div>${week(d)}<button class="g" data-a="pick" data-i="patient">Sign in to book</button></div>`).join('')}</div>`:`<p class="mu">No doctors match your search. Clear the filter to see everyone.</p>`}
function say(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(say.x);say.x=setTimeout(()=>t.style.display='none',2200)}
function log(m){S.log.unshift({t:new Date().toLocaleTimeString(),u:U?R[U.role].n+' · '+nm():'system',m})}
function addInv(aid,n,amt){let i=S.inv.find(x=>x.aid==aid);if(!i){i={id:++seq,aid,paid:false,items:[]};S.inv.push(i)}i.items.push({n,amt})}
const nm=()=>U.role=='doctor'?dn(U.ref):U.role=='patient'?pn(U.ref):(S.users.find(u=>u.role==U.role)||{}).name;

if(U&&U.role=='patient'&&has('my appointment','my bill','my visit')){const a=S.apts.filter(x=>x.pid==U.ref),b=S.inv.filter(i=>ap(i.aid)&&ap(i.aid).pid==U.ref&&!i.paid);
return (a.length?'Your appointments:\n'+a.map(x=>dn(x.did)+' on '+x.date+' ('+x.status+')').join('\n'):'You have no appointments yet.')+'\n'+(b.length?'Unpaid bills: '+money(b.reduce((s,i)=>s+tot(i),0)):'You have no unpaid bills.')}
const hit=S.docs.filter(d=>t.includes(d.dept.toLowerCase())||(d.name+' '+d.dept).toLowerCase().split(/[\s.]+/).some(w=>w.length>3&&!['general','medicine'].includes(w)&&t.includes(w)));
if(hit.length&&!has('fee','cost','price','charge'))return hit.slice(0,3).map(dinfo).join('\n\n');
if(has('fee','cost','price','charge'))return (hit.length?hit:S.docs).map(d=>d.name+' ('+d.dept+'): '+money(d.fee)).join('\n');
if(has('on duty','available','today','now','open','timing','hours')){const L=S.docs.filter(d=>['now','soon'].includes(avail(d).k));return L.length?'Doctors available today:\n'+L.map(d=>d.name+' ('+d.dept+') · '+avail(d).t).join('\n'):'No doctor is on duty right now. Please check the roster on the home page for the next duty day.'}
if(has('book','appointment','visit','schedule'))return 'To book: sign in to the Patient portal, open Appointments, choose a doctor and date, then press Book. Booking works only on the doctor’s duty days. Reception can also book for you.';
if(has('department','specialist','special','which doctor'))return 'Departments: '+[...new Set(S.docs.map(d=>d.dept))].join(', ')+'.';
if(has('lab','report','test','prescription','medicine','record'))return 'Lab results, prescriptions and bills are private. Sign in to the Patient portal to see yours.';
if(/\b(hi|hello|hey|salam|assalam)/.test(t))return 'Hello! Ask me about doctor timings, fees, departments or how to book.';
return 'I can answer questions about: doctors on duty today, timings, fees, departments and booking. Try “Who is available today?”'}
async function aiReply(t){if(AI_URL){try{const h=cAI.slice(Math.max(0,cAI.findIndex(x=>x.r=='me'))).map(x=>({role:x.r=='me'?'user':'assistant',content:x.t}));
const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:h,hospital:S.hosp,doctors:S.docs.map(d=>({name:d.name,dept:d.dept,fee:d.fee,from:d.from,to:d.to,status:avail(d).t}))})});
const j=await r.json();if(j&&j.reply)return j.reply}catch(e){console.error(e)}}
return localAI(t)}
function chatMsgs(){if(cTab=='ai')return cAI.map(m=>`<div class="mg ${m.r=='me'?'me':''}">${esc(m.t).replace(/\n/g,'<br>')}</div>`).join('')+(cBusy?'<div class="cn">Assistant is typing…</div>':'');
if(!U)return '<div class="cn">Sign in to join the live chat with hospital staff and patients.</div>';
return '<div class="cn">Real-time chat between everyone signed in on this device (any tab or window).</div>'+cLive.map(m=>`<div class="mg ${m.from==CID?'me':''}"><small>${esc(m.who)} · ${esc(m.time)}</small>${esc(m.t).replace(/\n/g,'<br>')}</div>`).join('')}
function chatUpd(){const b=document.querySelector('.cfab em');if(b){b.textContent=cUnread;b.style.display=cUnread?'block':'none'}const m=$('cm');if(m){m.innerHTML=chatMsgs();m.scrollTop=m.scrollHeight}}
function chatRender(){const d=$('ci')?$('ci').value:'',f=document.activeElement&&document.activeElement.id=='ci';
const can=cTab=='ai'||U;
$('chat').innerHTML=`<button class="cfab" data-c="toggle" aria-label="${cOpen?'Close chat':'Open chat'}">${cOpen?'✕':'💬'}<em style="display:${cUnread&&!cOpen?'block':'none'}">${cUnread}</em></button>`+(cOpen?`<div class="cp" role="dialog" aria-label="Chat"><div class="ch"><div><b>${esc(S.hosp)}</b><small>Chat</small></div><button class="sm g" data-c="toggle" aria-label="Close">✕</button></div>
<div class="ct"><button class="${cTab=='ai'?'on':''}" data-c="tab" data-t="ai">🤖 AI assistant</button><button class="${cTab=='live'?'on':''}" data-c="tab" data-t="live">👥 Live chat</button></div>
<div class="cm" id="cm" aria-live="polite"></div>
${cTab=='ai'?'<div class="cq"><button data-c="q" data-t="Who is available today?">Available today</button><button data-c="q" data-t="What are the consultation fees?">Fees</button><button data-c="q" data-t="How do I book an appointment?">Book</button></div>':''}
${can?'<div class="cf"><input id="ci" placeholder="'+(cTab=='ai'?'Ask a question…':'Message everyone…')+'" autocomplete="off" aria-label="Message"><button data-c="send">Send</button></div>':''}</div>`:'');
if(cOpen){if($('ci')){$('ci').value=d;if(f)$('ci').focus()}chatUpd()}}
async function csend(txt){const i=$('ci'),t=(txt||(i?i.value:'')).trim();if(!t)return;if(i)i.value='';
if(cTab=='live'){if(!U)return;const m={id:CID+Date.now(),who:R[U.role].n+' · '+nm(),time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),t,from:CID};cLive.push(m);if(CH)CH.postMessage(m);chatUpd();return}
cAI.push({r:'me',t});cBusy=true;chatUpd();const r=await aiReply(t);cBusy=false;cAI.push({r:'bot',t:r});chatUpd()}
$('chat').addEventListener('click',e=>{e.stopPropagation();const el=e.target.closest('[data-c]');if(!el)return;const a=el.dataset.c;
if(a=='toggle'){cOpen=!cOpen;if(cOpen&&cTab=='live')cUnread=0;chatRender();if($('ci'))$('ci').focus()}
else if(a=='tab'){cTab=el.dataset.t;if(cTab=='live')cUnread=0;chatRender();if($('ci'))$('ci').focus()}
else if(a=='send')csend();else if(a=='q')csend(el.dataset.t)});
$('chat').addEventListener('keydown',e=>{e.stopPropagation();if(e.key=='Enter'&&e.target.id=='ci')csend()});
{const _r=render;render=function(){_r();chatRender()}}

setInterval(()=>{if(!U&&$('dl'))$('dl').innerHTML=docList()},60000);
render();
</script>
